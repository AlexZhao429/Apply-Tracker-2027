<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请总控 2027 | 视觉优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        /* 瑞士风格：增强对中文排版的兼容 */
        body { 
            font-family: 'Inter', "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; 
            background-color: #f4f4f4; 
            color: #000; 
            -webkit-font-smoothing: antialiased;
            line-height: 1.5; /* 增加基础行高，防止汉字拥挤 */
        }

        .swiss-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; }
        
        /* 标题溢出处理 */
        .hyphens-auto { overflow-wrap: break-word; word-break: break-all; }
        
        /* 滚动条隐藏 */
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* 时间轴组件样式 */
        .timeline-line { height: 2px; background: black; position: relative; top: 11px; z-index: 0; }
        .milestone { width: 12px; height: 12px; background: black; border: 2px solid #f4f4f4; border-radius: 50%; z-index: 10; position: relative; }
        .milestone.active { background: #E62020; transform: scale(1.3); }

        .accent-red { color: #E62020; }
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-8 max-w-[1500px] mx-auto" x-data="appLogic()">

    <div x-show="view === 'list'" x-cloak class="fade-in">
        <header class="swiss-grid items-end mb-10 border-b-2 border-black pb-8">
            <div class="col-span-8">
                <h1 class="text-[5.5rem] font-black tracking-tighter uppercase leading-[0.8] mb-6">APPLY HUB<br>2027 FALL</h1>
                <div class="flex items-center space-x-4">
                    <p class="text-[10px] font-bold border-l-2 border-black pl-2">APPLICANT: 赵言果 / XJTLU</p>
                    <input type="file" accept=".csv" x-ref="csvInput" @change="handleCSVUpload" class="hidden">
                    <button @click="$refs.csvInput.click()" class="text-[10px] font-bold bg-black text-white px-3 py-1 hover:bg-red-600 transition-colors">导入战略表格 (CSV)</button>
                    <button @click="resetData()" class="text-[10px] font-bold border border-black px-3 py-1 hover:bg-black hover:text-white transition-colors">清空缓存</button>
                </div>
            </div>
            <div class="col-span-4 text-right">
                <p class="text-[10px] font-bold uppercase mb-1 tracking-widest">作品集总进度</p>
                <p class="text-8xl font-black tabular-nums leading-none" x-text="`${Math.round(totalProgress)}%`"></p>
            </div>
        </header>

        <section class="mb-16">
            <h2 class="text-[10px] font-bold uppercase tracking-[0.2em] mb-8 italic">00 / DEADLINE HISTORICAL TIMELINE</h2>
            <div class="relative pt-12 pb-4 overflow-x-auto hide-scroll">
                <div class="timeline-line min-w-[1200px]"></div>
                <div class="flex justify-between items-start min-w-[1200px] relative">
                    <template x-for="milestone in sortedDeadlines" :key="milestone.id">
                        <div class="flex flex-col items-center group cursor-pointer" @click="openDetail(milestone.schoolRef)" style="flex: 1">
                            <span class="absolute -top-10 text-[10px] font-mono font-bold whitespace-nowrap bg-white px-1 border border-black group-hover:bg-black group-hover:text-white transition-colors" 
                                  :class="getDaysLeft(milestone.date) < 60 ? 'accent-red border-red-600' : ''"
                                  x-text="milestone.date"></span>
                            <div class="milestone" :class="getDaysLeft(milestone.date) < 60 ? 'active' : ''"></div>
                            <span class="mt-4 text-[11px] font-black uppercase tracking-tighter text-center leading-tight max-w-[110px] hyphens-auto" x-text="milestone.name"></span>
                            <span class="text-[9px] font-bold text-gray-400 mt-1" x-text="`T-${getDaysLeft(milestone.date)}D`"></span>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <main class="swiss-grid mt-12">
            <section class="col-span-7 pr-12 border-r border-gray-300">
                <h2 class="text-[10px] font-bold uppercase tracking-widest italic mb-6">01 / SCHOOL ARRAY</h2>
                <template x-for="school in db.schools" :key="school.id">
                    <div class="group border-b border-black py-5 flex justify-between items-start hover:bg-white transition-colors px-2 -mx-2 cursor-pointer" @click="openDetail(school)">
                        <div class="w-4/5 pr-4">
                            <h3 class="text-3xl font-black uppercase tracking-tight group-hover:italic leading-[0.9] hyphens-auto" x-text="school.name"></h3>
                            <p class="text-[11px] font-bold mt-2 text-gray-500 leading-relaxed" x-text="school.program"></p>
                        </div>
                        <div class="w-1/5 text-right">
                            <span class="text-[10px] font-bold border border-black px-2 mb-2 inline-block whitespace-nowrap" x-text="school.tier"></span>
                            <p class="text-xs font-mono font-bold" x-text="school.ddl"></p>
                        </div>
                    </div>
                </template>
            </section>

            <section class="col-span-5 pl-12">
                <h2 class="text-[10px] font-bold uppercase tracking-widest italic mb-6">02 / PORTFOLIO TRACKER</h2>
                <template x-for="(project, pIndex) in db.projects" :key="project.id">
                    <div class="mb-10">
                        <div class="flex justify-between items-end mb-3">
                            <span class="text-xl font-black uppercase tracking-tight" x-text="project.title"></span>
                            <span class="text-2xl font-black tabular-nums" x-text="`${calcProjectProgress(project)}%`"></span>
                        </div>
                        <div class="grid grid-cols-5 gap-1">
                            <template x-for="(stage, sIndex) in project.stages">
                                <button @click="toggleStage(pIndex, sIndex)" 
                                    class="h-12 border text-[9px] font-bold flex items-center justify-center text-center px-1 transition-all leading-none"
                                    :class="stage.done ? 'bg-black text-white border-black' : 'bg-white border-gray-300 hover:border-black'"
                                    x-text="stage.name"></button>
                            </template>
                        </div>
                    </div>
                </template>
            </section>
        </main>
    </div>

    <div x-show="view === 'detail'" x-cloak class="fade-in">
        <nav class="mb-10">
            <button @click="view = 'list'" class="text-[10px] font-bold border-2 border-black px-6 py-3 hover:bg-black hover:text-white transition-all tracking-widest">← BACK TO OVERVIEW</button>
        </nav>
        
        <div class="swiss-grid border-t-8 border-black pt-10">
            <div class="col-span-8">
                <h2 class="text-[11px] font-bold accent-red mb-3 tracking-[0.3em]" x-text="`TIER: ${selectedSchool?.tier}`"></h2>
                <h1 class="text-[8vw] font-black tracking-tighter uppercase leading-[0.85] hyphens-auto" x-text="selectedSchool?.name"></h1>
                <p class="text-2xl font-bold mt-8 border-b-4 border-black pb-6 leading-tight" x-text="selectedSchool?.program"></p>
                
                <div class="swiss-grid mt-16">
                    <div class="col-span-6 border-l-2 border-black pl-6 flex flex-col">
                        <h4 class="text-[10px] font-bold italic mb-6 tracking-widest text-gray-400">A / PORTFOLIO REQUIREMENTS</h4>
                        <p class="text-xl font-medium leading-[1.6] whitespace-pre-line pr-10" x-text="selectedSchool?.reqs || 'TBD'"></p>
                    </div>
                    <div class="col-span-6 border-l border-gray-300 pl-6 flex flex-col">
                        <h4 class="text-[10px] font-bold italic mb-6 tracking-widest text-gray-400">B / GENERAL DOCUMENTS</h4>
                        <p class="text-sm font-medium leading-[1.7] text-gray-700 whitespace-pre-line" x-text="selectedSchool?.general_reqs || 'TBD'"></p>
                    </div>
                </div>
            </div>
            
            <div class="col-span-4 border-l-4 border-black pl-10 h-fit">
                <div class="mb-16">
                    <h4 class="text-[10px] font-bold italic mb-4 tracking-widest">C / DEADLINE</h4>
                    <p class="text-5xl font-black font-mono leading-none" x-text="selectedSchool?.ddl"></p>
                    <p class="text-lg font-bold mt-3 accent-red" x-text="`${getDaysLeft(selectedSchool?.ddl)} DAYS REMAINING`"></p>
                </div>
                <div>
                    <h4 class="text-[10px] font-bold italic mb-4 tracking-widest">D / OFFICIAL RESOURCE</h4>
                    <template x-if="selectedSchool?.link">
                        <a :href="selectedSchool.link" target="_blank" class="block text-sm font-bold bg-black text-white p-5 text-center hover:bg-red-600 transition-colors uppercase tracking-widest">
                            VISIT OFFICIAL SITE
                        </a>
                    </template>
                    <div class="mt-4 p-4 bg-gray-100 border border-gray-200">
                        <p class="text-[9px] uppercase font-bold text-gray-400 mb-2">Cleaned URL:</p>
                        <p class="text-[10px] font-mono break-all text-gray-600 leading-relaxed" x-text="selectedSchool?.link || 'N/A'"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function appLogic() {
            return {
                view: 'list',
                selectedSchool: null,
                db: { schools: [], projects: [] },

                get sortedDeadlines() {
                    return [...this.db.schools]
                        .filter(s => s.ddl)
                        .sort((a, b) => new Date(a.ddl) - new Date(b.ddl))
                        .map(s => ({ id: s.id, name: s.name, date: s.ddl, schoolRef: s }));
                },

                init() {
                    const saved = localStorage.getItem('applyTracker_Yanguo_V5_1');
                    if (saved) { this.db = JSON.parse(saved); } 
                    else {
                        this.db.projects = [
                            { id: 1, title: "Inclusive Hygiene", weight: 0.4, stages: [{name:"调研", weight:0.15, done:true}, {name:"概念", weight:0.15, done:true}, {name:"建模", weight:0.2, done:false}, {name:"原型", weight:0.35, done:false}, {name:"排版", weight:0.15, done:false}] },
                            { id: 2, title: "FiDU Candle", weight: 0.3, stages: [{name:"材料", weight:0.25, done:false}, {name:"焊接", weight:0.25, done:false}, {name:"造型", weight:0.2, done:false}, {name:"制作", weight:0.2, done:false}, {name:"归档", weight:0.1, done:false}] },
                            { id: 3, title: "Touchscope", weight: 0.3, stages: [{name:"硬件", weight:0.2, done:false}, {name:"代码", weight:0.3, done:false}, {name:"外壳", weight:0.2, done:false}, {name:"交互", weight:0.2, done:false}, {name:"演示", weight:0.1, done:false}] }
                        ];
                    }
                    this.$watch('db', val => localStorage.setItem('applyTracker_Yanguo_V5_1', JSON.stringify(val)));
                },

                openDetail(school) {
                    this.selectedSchool = school;
                    this.view = 'detail';
                    window.scrollTo(0,0);
                },

                handleCSVUpload(e) {
                    const file = e.target.files[0];
                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (res) => {
                            this.db.schools = res.data.map((row, i) => {
                                const getVal = (keys) => {
                                    for(let k of keys) { if(row[k]) return row[k].trim(); }
                                    return '';
                                };
                                const titleRaw = getVal(['院校/项目 (学制)', '院校/项目']);
                                const titleParts = titleRaw.split('\n');
                                const rawLink = getVal(['官方链接 & IG', '官方链接']);
                                const urlMatch = rawLink.match(/(https?:\/\/[^\s\n\r"']+)/);

                                return {
                                    id: i,
                                    name: titleParts[0] || 'Unknown',
                                    program: titleParts[1] || '',
                                    tier: getVal(['战略阵列']).split('\n')[0],
                                    reqs: getVal(['🎯 作品集精准要求 (1-2-3)', '作品集精准要求']),
                                    general_reqs: getVal(['常规网申要求 (不含语言)', '常规网申要求']),
                                    link: urlMatch ? urlMatch[0] : '',
                                    ddl: getVal(['DDL']) || '2026-12-15'
                                };
                            }).filter(s => s.name !== 'Unknown');
                            alert("赵言果，排版修正版数据已同步。");
                        }
                    });
                },

                toggleStage(pIdx, sIdx) { this.db.projects[pIdx].stages[sIdx].done = !this.db.projects[pIdx].stages[sIdx].done; },
                calcProjectProgress(p) { return Math.round(p.stages.reduce((acc, s) => s.done ? acc + s.weight : acc, 0) * 100); },
                get totalProgress() { return this.db.projects.reduce((acc, p) => acc + (this.calcProjectProgress(p)/100 * p.weight), 0) * 100; },
                getDaysLeft(d) { 
                    const diff = new Date(d) - new Date();
                    return diff > 0 ? Math.ceil(diff / 86400000) : 0;
                },
                resetData() { if(confirm("确定清空吗？")) { localStorage.clear(); location.reload(); } }
            }
        }
    </script>
</body>
</html>

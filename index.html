<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申请总控 2027 | 移动适配版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; 
            background-color: #f4f4f4; color: #000; -webkit-font-smoothing: antialiased;
            line-height: 1.4;
        }
        /* 移动端横向滚动优化 */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .timeline-line { height: 2px; background: black; position: relative; top: 11px; z-index: 0; }
        .milestone { width: 12px; height: 12px; background: black; border: 2px solid #f4f4f4; border-radius: 50%; z-index: 10; position: relative; }
        .milestone.active { background: #E62020; transform: scale(1.2); }
        .accent-red { color: #E62020; }
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-8 max-w-[1500px] mx-auto" x-data="appLogic()">

    <div x-show="view === 'list'" x-cloak class="fade-in">
        <header class="flex flex-col md:grid md:grid-cols-12 md:items-end mb-8 md:mb-12 border-b-2 border-black pb-6 md:pb-8">
            <div class="md:col-span-8">
                <h1 class="text-5xl md:text-[5.5rem] font-black tracking-tighter uppercase leading-[0.85] mb-4 md:mb-6">APPLY HUB<br>2027 FALL</h1>
                <div class="flex flex-wrap items-center gap-2 mt-4">
                    <p class="text-[9px] md:text-[10px] font-bold border-l-2 border-black pl-2 whitespace-nowrap">赵言果 / XJTLU</p>
                    <input type="file" accept=".csv" x-ref="csvInput" @change="handleCSVUpload" class="hidden">
                    <button @click="$refs.csvInput.click()" class="text-[9px] md:text-[10px] font-bold bg-black text-white px-2 py-1 hover:bg-red-600 transition-colors">导入 CSV</button>
                    <button @click="resetData()" class="text-[9px] md:text-[10px] font-bold border border-black px-2 py-1 hover:bg-black hover:text-white transition-colors">清空</button>
                </div>
            </div>
            <div class="mt-6 md:mt-0 md:col-span-4 text-left md:text-right">
                <p class="text-[9px] md:text-[10px] font-bold uppercase mb-1 tracking-widest">作品集总进度</p>
                <p class="text-6xl md:text-8xl font-black tabular-nums leading-none" x-text="`${Math.round(totalProgress)}%`"></p>
            </div>
        </header>

        <section class="mb-12">
            <h2 class="text-[9px] md:text-[10px] font-bold uppercase tracking-[0.2em] mb-6 italic">00 / DEADLINE TIMELINE</h2>
            <div class="relative pt-10 pb-4 overflow-x-auto hide-scroll touch-pan-x">
                <div class="timeline-line min-w-[800px] md:min-w-[1200px]"></div>
                <div class="flex justify-between items-start min-w-[800px] md:min-w-[1200px] relative">
                    <template x-for="milestone in sortedDeadlines" :key="milestone.id">
                        <div class="flex flex-col items-center group cursor-pointer" @click="openDetail(milestone.schoolRef)" style="flex: 1">
                            <span class="absolute -top-10 text-[9px] font-mono font-bold whitespace-nowrap bg-white px-1 border border-black" 
                                  :class="getDaysLeft(milestone.date) < 60 ? 'accent-red border-red-600' : ''" x-text="milestone.date"></span>
                            <div class="milestone" :class="getDaysLeft(milestone.date) < 60 ? 'active' : ''"></div>
                            <span class="mt-3 text-[10px] md:text-[11px] font-black uppercase tracking-tighter text-center leading-tight max-w-[80px]" x-text="milestone.name"></span>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <main class="flex flex-col md:grid md:grid-cols-12 gap-8 md:gap-12 mt-8">
            <section class="md:col-span-7 md:pr-12 md:border-r md:border-gray-300">
                <h2 class="text-[9px] md:text-[10px] font-bold uppercase tracking-widest italic mb-4">01 / SCHOOL ARRAY</h2>
                <template x-for="school in db.schools" :key="school.id">
                    <div class="group border-b border-black py-4 flex justify-between items-start hover:bg-white transition-colors px-1 cursor-pointer" @click="openDetail(school)">
                        <div class="w-3/4 pr-4">
                            <h3 class="text-2xl md:text-3xl font-black uppercase tracking-tight leading-[0.9]" x-text="school.name"></h3>
                            <p class="text-[10px] md:text-[11px] font-bold mt-1 text-gray-500 leading-tight" x-text="school.program"></p>
                        </div>
                        <div class="text-right whitespace-nowrap">
                            <span class="text-[9px] font-bold border border-black px-1.5 mb-1 inline-block" x-text="school.tier"></span>
                            <p class="text-[10px] font-mono font-bold" x-text="school.ddl"></p>
                        </div>
                    </div>
                </template>
            </section>

            <section class="md:col-span-5 md:pl-12">
                <h2 class="text-[9px] md:text-[10px] font-bold uppercase tracking-widest italic mb-4">02 / PORTFOLIO TRACKER</h2>
                <template x-for="(project, pIndex) in db.projects" :key="project.id">
                    <div class="mb-8">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-lg md:text-xl font-black uppercase tracking-tight" x-text="project.title"></span>
                            <span class="text-xl md:text-2xl font-black tabular-nums" x-text="`${calcProjectProgress(project)}%`"></span>
                        </div>
                        <div class="grid grid-cols-3 md:grid-cols-5 gap-1">
                            <template x-for="(stage, sIndex) in project.stages">
                                <button @click="toggleStage(pIndex, sIndex)" 
                                    class="h-10 md:h-12 border text-[8px] md:text-[9px] font-bold flex items-center justify-center text-center px-1 transition-all leading-none"
                                    :class="stage.done ? 'bg-black text-white border-black' : 'bg-white border-gray-300'"
                                    x-text="stage.name"></button>
                            </template>
                        </div>
                    </div>
                </template>
            </section>
        </main>
    </div>

    <div x-show="view === 'detail'" x-cloak class="fade-in">
        <nav class="mb-6 md:mb-10">
            <button @click="view = 'list'" class="text-[9px] md:text-[10px] font-bold border-2 border-black px-4 py-2 md:px-6 md:py-3 hover:bg-black hover:text-white transition-all">← BACK</button>
        </nav>
        
        <div class="flex flex-col md:grid md:grid-cols-12 border-t-4 md:border-t-8 border-black pt-6 md:pt-10 gap-8">
            <div class="md:col-span-8">
                <h2 class="text-[10px] font-bold accent-red mb-2 tracking-[0.2em]" x-text="`TIER: ${selectedSchool?.tier}`"></h2>
                <h1 class="text-5xl md:text-[8vw] font-black tracking-tighter uppercase leading-[0.9] break-words" x-text="selectedSchool?.name"></h1>
                <p class="text-xl md:text-3xl font-bold mt-4 md:mt-8 border-b-2 md:border-b-4 border-black pb-4 md:pb-6" x-text="selectedSchool?.program"></p>
                
                <div class="flex flex-col md:grid md:grid-cols-12 mt-8 md:mt-16 gap-8">
                    <div class="md:col-span-6 border-l-2 border-black pl-4 md:pl-6">
                        <h4 class="text-[9px] md:text-[10px] font-bold italic mb-4 text-gray-400">A / PORTFOLIO REQS</h4>
                        <p class="text-base md:text-xl font-medium leading-relaxed whitespace-pre-line" x-text="selectedSchool?.reqs || 'TBD'"></p>
                    </div>
                    <div class="md:col-span-6 border-l md:border-gray-300 pl-4 md:pl-6">
                        <h4 class="text-[9px] md:text-[10px] font-bold italic mb-4 text-gray-400">B / DOCUMENTS</h4>
                        <p class="text-sm font-medium leading-relaxed text-gray-700 whitespace-pre-line" x-text="selectedSchool?.general_reqs || 'TBD'"></p>
                    </div>
                </div>
            </div>
            
            <div class="md:col-span-4 border-l-4 border-black pl-6 md:pl-10 h-fit pb-12">
                <div class="mb-8 md:mb-16">
                    <h4 class="text-[9px] md:text-[10px] font-bold italic mb-2">C / DEADLINE</h4>
                    <p class="text-4xl md:text-5xl font-black font-mono leading-none" x-text="selectedSchool?.ddl"></p>
                    <p class="text-sm md:text-lg font-bold mt-2 accent-red" x-text="`${getDaysLeft(selectedSchool?.ddl)} DAYS LEFT`"></p>
                </div>
                <div>
                    <h4 class="text-[9px] md:text-[10px] font-bold italic mb-2">D / RESOURCE</h4>
                    <template x-if="selectedSchool?.link">
                        <a :href="selectedSchool.link" target="_blank" class="block text-xs font-bold bg-black text-white p-4 text-center hover:bg-red-600 transition-colors uppercase">VISIT SITE</a>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function appLogic() {
            return {
                view: 'list', selectedSchool: null, db: { schools: [], projects: [] },
                get sortedDeadlines() {
                    return [...this.db.schools].filter(s => s.ddl).sort((a, b) => new Date(a.ddl) - new Date(b.ddl))
                        .map(s => ({ id: s.id, name: s.name, date: s.ddl, schoolRef: s }));
                },
                init() {
                    const saved = localStorage.getItem('applyTracker_Yanguo_MobileV1');
                    if (saved) { this.db = JSON.parse(saved); } 
                    else {
                        this.db.projects = [
                            { id: 1, title: "Inclusive Hygiene", weight: 0.4, stages: [{name:"调研", weight:0.2, done:true}, {name:"概念", weight:0.2, done:true}, {name:"建模", weight:0.2, done:false}, {name:"原型", weight:0.3, done:false}, {name:"排版", weight:0.1, done:false}] },
                            { id: 2, title: "FiDU Candle", weight: 0.3, stages: [{name:"材料", weight:0.3, done:false}, {name:"焊接", weight:0.3, done:false}, {name:"造型", weight:0.2, done:false}, {name:"成品", weight:0.2, done:false}] },
                            { id: 3, title: "Touchscope", weight: 0.3, stages: [{name:"硬件", weight:0.2, done:false}, {name:"代码", weight:0.3, done:false}, {name:"外壳", weight:0.2, done:false}, {name:"交互", weight:0.2, done:false}, {name:"演示", weight:0.1, done:false}] }
                        ];
                    }
                    this.$watch('db', val => localStorage.setItem('applyTracker_Yanguo_MobileV1', JSON.stringify(val)));
                },
                openDetail(school) { this.selectedSchool = school; this.view = 'detail'; window.scrollTo(0,0); },
                handleCSVUpload(e) {
                    const file = e.target.files[0];
                    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (res) => {
                        this.db.schools = res.data.map((row, i) => {
                            const getVal = (keys) => { for(let k of keys) { if(row[k]) return row[k].trim(); } return ''; };
                            const titleParts = (getVal(['院校/项目 (学制)', '院校/项目'])).split('\n');
                            const urlMatch = (getVal(['官方链接 & IG', '官方链接'])).match(/(https?:\/\/[^\s\n\r"']+)/);
                            return { id: i, name: titleParts[0] || 'Unknown', program: titleParts[1] || '', tier: getVal(['战略阵列']).split('\n')[0],
                                     reqs: getVal(['🎯 作品集精准要求 (1-2-3)', '作品集精准要求']), general_reqs: getVal(['常规网申要求 (不含语言)']),
                                     link: urlMatch ? urlMatch[0] : '', ddl: getVal(['DDL']) || '2026-12-15' };
                        }).filter(s => s.name !== 'Unknown');
                        alert("赵言果，移动适配版数据同步成功。");
                    }});
                },
                toggleStage(pIdx, sIdx) { this.db.projects[pIdx].stages[sIdx].done = !this.db.projects[pIdx].stages[sIdx].done; },
                calcProjectProgress(p) { return Math.round(p.stages.reduce((acc, s) => s.done ? acc + s.weight : acc, 0) * 100); },
                get totalProgress() { return this.db.projects.reduce((acc, p) => acc + (this.calcProjectProgress(p)/100 * p.weight), 0) * 100; },
                getDaysLeft(d) { const diff = new Date(d) - new Date(); return diff > 0 ? Math.ceil(diff / 86400000) : 0; },
                resetData() { if(confirm("确定清空吗？")) { localStorage.clear(); location.reload(); } }
            }
        }
    </script>
</body>
</html>
